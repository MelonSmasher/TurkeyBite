[project]
name = "tbconsole"
version = "0.1.0"
description = "TurkeyBite Console: search, analytics, findings and alerting for TurkeyBite"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:ldap3.*"]
