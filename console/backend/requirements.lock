# Every package the console installs, at the version CI and the image use,
# resolved on Python 3.13 for Linux, each with the hashes of the files PyPI
# publishes for it, so pip installs exactly these bytes or nothing.
# requirements.txt says what the console needs; this holds the rest still.
# Install with: pip install --require-hashes -r requirements.lock
# Regenerate after changing requirements.txt: resolve the versions with
#   docker run --rm -v "$PWD/requirements.txt:/r.txt:ro" python:3.13-slim sh -c \
#     "pip install -q -r /r.txt && pip freeze --exclude pip --exclude setuptools --exclude wheel"
# then take each version's hashes from https://pypi.org/pypi/<name>/<version>/json.
