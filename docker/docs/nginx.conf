# Serves the built site at /docs/ and nothing else. The console in front of it
# decides who may read it and adds the security headers its pages get.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Behind the console the host and port nginx sees are not the ones people
    # use, so a redirect names only the path
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
        # Pages change with each build, so they are checked each time
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;

        location /docs/assets/ {
            # Material names its own bundles by their content; the rest are
            # small, and an hour is short enough to pick up a new build
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    location / {
        return 404;
    }
}
