# Serves the built site at /docs/ and nothing else. The console in front of it
# decides who may read it, and passes on the Content-Security-Policy the build
# wrote for the site's own inline scripts (docker/docs/hooks.py).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Behind the console the host and port nginx sees are not the ones people
    # use, so a redirect names only the path
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
        # Checked each time, against its ETag: pages, images and the
        # tutorial's own script change with each build and keep their names
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        include /etc/nginx/docs-csp.conf;

        # The theme's bundles carry a hash of their content in their names
        location ~ "^/docs/assets/.+\.[0-9a-f]{8}\.min\.(js|css)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            include /etc/nginx/docs-csp.conf;
        }
    }

    location / {
        return 404;
    }
}
