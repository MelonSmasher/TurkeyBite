services:
  turkeybite-worker:
    # Bounded so the log cannot fill the host. The worker writes a line per
    # observed packet, which at campus rates is gigabytes a day, and the default
    # json-file driver rotates nothing. Five files of 100 MB also keeps
    # `docker logs --since` fast, which it stops being once the file is
    # gigabytes. Durable logs belong in syslog, configured separately.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: turkeybite-worker
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      bind9:
        condition: service_started
    volumes:
      - ./config.yaml:/turkey-bite/config.yaml:ro
      - ./vols/lists:/turkey-bite/lists
      - ./vols/logs:/var/log/turkey-bite
    secrets:
      - valkey_password
    environment:
      - TZ
      - VALKEY_HOST
      - VALKEY_PORT
      - TURKEYBITE_WORKER_PROCS
      - TURKEYBITE_WORKER_CLASS
      - TURKEYBITE_PIPELINE
      - TURKEYBITE_CONSUMER_PREFIX
      - TURKEYBITE_INDEX_SYNC_INTERVAL_SEC
    networks:
      - tb-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
