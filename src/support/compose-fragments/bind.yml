services:
  bind9:
    # Bounded so the log cannot fill the host. The worker writes a line per
    # observed packet, which at campus rates is gigabytes a day, and the default
    # json-file driver rotates nothing. Five files of 100 MB also keeps
    # `docker logs --since` fast, which it stops being once the file is
    # gigabytes. Durable logs belong in syslog, configured separately.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    image: ubuntu/bind9:9.18-24.04_beta
    container_name: bind9
    restart: unless-stopped
    expose:
      - "53"
      - "53/udp"
    environment:
      - TZ
    networks:
      tb-net:
        ipv4_address: ${BIND9_IP:-172.172.0.100}
    volumes:
      - bind9_cache:/var/cache/bind
      - ./vols/bind/slave.conf:/etc/bind/slave.conf:ro
      - ./vols/bind/named.conf.options:/etc/bind/named.conf.options:ro
      - ./vols/bind/named.conf.local:/etc/bind/named.conf.local:ro
