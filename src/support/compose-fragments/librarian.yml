services:
  turkeybite-librarian:
    # Bounded so the log cannot fill the host. The worker writes a line per
    # observed packet, which at campus rates is gigabytes a day, and the default
    # json-file driver rotates nothing. Five files of 100 MB also keeps
    # `docker logs --since` fast, which it stops being once the file is
    # gigabytes. Durable logs belong in syslog, configured separately.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    build:
      context: .
      dockerfile: docker/librarian/Dockerfile
    container_name: turkeybite-librarian
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./config.yaml:/turkey-bite/config.yaml:ro
      - ./vols/lists:/turkey-bite/lists
      - ./vols/logs:/var/log/turkey-bite
    secrets:
      - valkey_password
    environment:
      - TZ
      - VALKEY_HOST
      - VALKEY_PORT
      - TURKEYBITE_HOSTS_INTERVAL_MIN
      - TURKEYBITE_IGNORELIST_INTERVAL_MIN
      - TURKEYBITE_RETENTION_DAYS
      - OPENSEARCH_HOST
      - OPENSEARCH_USERNAME
      - OPENSEARCH_PASSWORD
      - OPENSEARCH_CA_CERT
      - TURKEYBITE_ALLOW_DEFAULT_PASSWORD
    networks:
      - tb-net
