redis:
  host: valkey
  port: 6379
  channel: turkeybite
  password_file: /run/secrets/valkey_password
  db: 0
  host_list_db: 1

sieve:
# browserbeat rules
  browserbeat:
    ignore:
      clients:
        # - 192.168.1.1
        # - somehost-to-ignore
      users:
        # - root
      domains:
        # - whitelisted-domain.com
      hosts:
        # - www.whitelisted-domain.com

# DNS packagebeat rules
  drop_replies: true
  drop_error_packets: true
  ignore:
    # Ignore entire domains
    domains:
      # - whitelisted-domain.com
      # Reverse zones name the octets backwards, so the zone covering
      # 192.168.0.0/16 is 168.192.in-addr.arpa. A single octet has no order
      # to get wrong, which is why 10.in-addr.arpa reads the way it does.
      - 10.in-addr.arpa
      - 168.192.in-addr.arpa
      - default.svc
      - kubernetes.default
    # Ignore specific client IP addresses
    clients:
      - 127.0.0.1
    # Ignore specific hostnames
    hosts:
      - kubernetes.default.svc

processor:
  # Domain category lookups.
  #   valkey  one Valkey GET per synthesised key, the original behaviour
  #   index   the memory-mapped index only, no Valkey round trips per event
  #   compare run both, keep the Valkey answer, record the index answer beside
  #           it as bite.contexts_index and bite.context_match so agreement can
  #           be measured on live traffic before switching over
  #
  # Only the index weighs its evidence (see `evidence` below), so it is the
  # mode to run if false positives matter. Valkey asserts anything any list
  # says, and in compare mode most disagreements are the index declining
  # something Valkey would have asserted.
  domain_index:
    mode: valkey
    path: lists/index/domains.tbidx
    # Where a worker gets the index file.
    #   file    it is already on local disk, single-node deployments
    #   valkey  the librarian publishes it and workers download it, which is
    #           needed because ./vols/lists is a per-node bind mount
    source: file
    # Set on the node running the librarian when any worker is on another host.
    # Deliberately independent of `source`: that node's own worker reads the file
    # directly while a remote worker needs it published.
    publish: false
    sync_interval_sec: 300
  # How much agreement a category needs before an event asserts it. Each list
  # in host_files.json has a trust level:
  #   high    believed alone: narrow vendor lists and your own curated lists
  #   medium  believed when this many independent publishers agree
  #   low     never believed, only recorded
  # A category that falls short is still recorded on the event, in
  # bite.contexts_candidate, so nothing is lost. 1 lets one medium list assert
  # on its own, which brings back most of the false positives this removes.
  #
  # The bar can differ by taxonomy branch or path, the names bite.purpose and
  # bite.risk use, with `default` for everything not named. The most specific
  # key wins, and a key the taxonomy does not know stops the worker at start.
  #   min_publishers:
  #     default: 2
  #     threat: 1             # malware, phishing and every other threat
  #     adult.pornography: 3
  # Measured on the Tranco top 10,000, `threat: 1` raises the domains carrying
  # a threat category from 5 to 57, nearly all of them wrong: ad networks,
  # workers.dev, archive.ph, telegra.ph, bet365.com, bitcoin.org.
  #
  # disabled_categories switches whole categories off by taxonomy branch or
  # path, without deleting the lists that carry them. A disabled category
  # leaves nothing on the event, not even in bite.claims or
  # bite.contexts_suppressed, exactly as if its lists were not there. Unlike
  # the rest of these settings it holds in every lookup mode, valkey included.
  #
  # `editorial` is the fakenews, fascist and zionist lists, which label news
  # and opinion sites by viewpoint. It is off unless you turn it on: leaving
  # this key out means [editorial] too. A list you write replaces that default
  # rather than adding to it, so to switch the editorial lists back on, write
  #   disabled_categories: []
  # or comment out every entry under the key, which means the same.
  #
  # resolvers asks public filtering resolvers for a second opinion on a
  # category one list claims: Quad9 (9.9.9.9) and Cloudflare (1.1.1.2) on
  # threats, and with `adult` Cloudflare's family resolver (1.1.1.3) on porn. A
  # block counts as one more independent publisher agreeing, never as evidence
  # on its own, and only in the exact shape each provider was measured to use,
  # confirmed against its unfiltered resolver. Off by default: it sends those
  # domain names, never client addresses, to Quad9 and Cloudflare, and needs
  # outbound UDP and TCP port 53 to every address below. Unknown keys or bad
  # values stop the worker at start. See "Asking public resolvers" in the
  # README for what it sends and how often.
  #   resolvers:
  #     enable: true
  #     adult: false            # also ask 1.1.1.3 about porn; about 1 in 20 wrong
  #     timeout_sec: 0.5        # the most one lookup waits, in all
  #     backoff_sec: 60         # rest for a resolver after 3 failures in a row
  #     cache:
  #       ttl_sec: 3600         # settled answers only, never a failure
  #       max_entries: 50000
  #     addresses:              # these are the defaults
  #       quad9: 9.9.9.9
  #       quad9_unfiltered: 9.9.9.10
  #       cloudflare_security: 1.1.1.2
  #       cloudflare_family: 1.1.1.3
  #       cloudflare_unfiltered: 1.1.1.1
  evidence:
    min_publishers: 2
    disabled_categories:
      - editorial
    resolvers:
      enable: false
  dns:
    lookup_ips: true
    resolvers:
      - 172.172.0.100
    # Reverse DNS answers are remembered per client address, which only helps
    # when the process outlives a job: the consume path or rq.SimpleWorker, not
    # the forking rq.Worker. Only settled answers are kept, so a resolver
    # failure is retried on the next event rather than pinned for the TTL.
    cache:
      ttl_sec: 900
      max_entries: 20000
  elastic:
    enable: true
    index_prefix: tb-index
    # Batching only helps when a worker handles more than one job, so it needs
    # TURKEYBITE_WORKER_CLASS=rq.SimpleWorker. It also opens a loss window: RQ
    # marks a job finished when the processor returns, so buffered documents are
    # gone if a worker dies uncleanly. Flush hooks cover a clean stop and a
    # SIGTERM, not a SIGKILL. Leave this off until the queue can acknowledge
    # after the flush.
    bulk:
      enable: false
      size: 500
      interval_sec: 2
    hosts:
      - uri: https://opensearch:9200
        username: admin
        password: Changeit12345!
  syslog:
    # Syslog UDP
    enable: false
    port: 514
    host: graylog