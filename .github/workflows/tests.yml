name: Tests

on:
  # Pull requests run tests directly; every master push runs them through the
  # image workflow, which waits for both suites before publishing.
  pull_request:
  workflow_call:
permissions:
  contents: read

# A reusable call and a direct PR run have the same ref/SHA. The caller's
# workflow name separates them; only superseded direct runs cancel each other.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    # The librarian's script waits up to ten minutes for OpenSearch, so a test
    # that let it reach a real cluster would hang rather than fail
    timeout-minutes: 10
    # A real Valkey, for the Lua that libtb.radius runs in it. The fakes do in
    # Python what it does, and this holds the two together.
    services:
      valkey:
        image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports:
          - 6379:6379
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the suite is checked against, and the newest
        # release, which is what the containers' python:3-alpine runs
        python: ['3.12', '3.x']
    steps:
      # Pinned to commits, since a tag can be moved to point at other code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install the runtime requirements
        run: TB_VENV=$PWD/.venv tests/run.sh --prepare

      - name: Run the tests without network access
        # In a network namespace holding only loopback, so a test that reaches
        # the network fails here instead of passing while the network is up.
        # Making the namespace needs root; the tests run as the runner again.
        run: >-
          sudo unshare --net sh -c
          "ip link set lo up && exec sudo -u $(id -un) env TB_VENV=$PWD/.venv tests/run.sh"

      - name: Run the Lua against a real Valkey
        # Outside the namespace above, since it needs the service
        run: TB_VENV=$PWD/.venv TB_TEST_VALKEY=redis://127.0.0.1:6379/0 tests/run.sh test_radius.RealValkeyTest
